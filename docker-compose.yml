version: '3.8'

services:
  db:
    image: postgres:15-alpine
    container_name: staffcar-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: your_secure_password
      POSTGRES_DB: staffcar_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - staffcar-net

  backend:
    build: ./backend
    container_name: staffcar-api
    ports:
      - "3000:3000"
    environment:
      PORT: 3000
      DB_HOST: db
      DB_USER: postgres
      DB_PASSWORD: your_secure_password
      DB_NAME: staffcar_db
      DB_PORT: 5432
    depends_on:
      - db
    networks:
      - staffcar-net

  frontend:
    build: ./frontend
    container_name: staffcar-web
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - staffcar-net

volumes:
  postgres_data:

networks:
  staffcar-net: